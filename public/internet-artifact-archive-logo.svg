<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="240" viewBox="0 0 1320 240" role="img" aria-labelledby="title desc">
  <title id="title">Internet Artifact Archive wordmark</title>
  <desc id="desc">The site name in the same vintage archive stamp style used on the site.</desc>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9b2c25"/>
      <stop offset="100%" stop-color="#6f1f1b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#6a4726" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1320" height="240" fill="none"/>

  <g filter="url(#shadow)">
    <g transform="translate(24 28) rotate(-1.5 636 92)">
      <rect x="0" y="0" width="1272" height="184" rx="14" fill="#f6ead0" stroke="url(#ink)" stroke-width="6"/>
      <rect x="16" y="16" width="1240" height="152" rx="10" fill="none" stroke="#8b3a31" stroke-width="3" stroke-dasharray="10 9" opacity="0.55"/>
      <rect x="31" y="31" width="1210" height="122" rx="7" fill="none" stroke="rgba(122,34,28,0.14)" stroke-width="1.5"/>

      <text x="636" y="106" fill="url(#ink)" text-anchor="middle" font-family="'Rubik Dirt', 'Special Elite', 'Courier New', monospace" font-size="74" letter-spacing="0.8">Internet Artifact Archive</text>
      <text x="638" y="108" fill="rgba(121,33,31,0.22)" text-anchor="middle" font-family="'Rubik Dirt', 'Special Elite', 'Courier New', monospace" font-size="74" letter-spacing="0.8">Internet Artifact Archive</text>
    </g>
  </g>
</svg>
